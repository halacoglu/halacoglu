
      - name: Calculate GitHub membership
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from calendar import monthrange

          username = "halacoglu"
          url = f"https://api.github.com/users/{username}"

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "GitHub-Membership-Badge"
              }
          )

          with urllib.request.urlopen(request) as response:
              user = json.load(response)

          created = datetime.fromisoformat(
              user["created_at"].replace("Z", "+00:00")
          ).date()

          today = datetime.now(timezone.utc).date()

          years = today.year - created.year
          months = today.month - created.month
          days = today.day - created.day

          if days < 0:
              months -= 1
              previous_month = today.month - 1 or 12
              previous_year = today.year if today.month > 1 else today.year - 1
              days += monthrange(previous_year, previous_month)[1]

          if months < 0:
              years -= 1
              months += 12

          message = f"{years} years {months} months {days} days"

          badge = {
              "schemaVersion": 1,
              "label": "GitHub member",
              "message": message,
              "color": "181717"
          }

          with open("github-years.json", "w") as file:
              json.dump(badge, file, indent=2)
              file.write("\n")

          print(f"GitHub membership: {message}")
          print(f"Account created: {created}")
          PY
